activate:
  name: Activate Home Assistant ownership
  description: Transfer the ESP32 to Home Assistant transport ownership while idle.
set_alarm:
  name: Set strap alarm
  description: Accept an explicit dated alarm instruction and verify it by strap readback.
  fields:
    when:
      name: Alarm time
      description: Timezone-aware date/time or Unix timestamp, rounded to a future minute.
      required: true
      selector:
        text:
    request_id:
      name: Request ID
      description: Stable identifier for idempotent retries of this instruction.
      required: true
      selector:
        text:
    context:
      name: Caller context
      description: Optional caller-owned state retained with the durable instruction.
      selector:
        object:
cancel_alarm:
  name: Cancel bridge alarm
  description: Cancel only the matching bridge-owned strap alarm, with readback verification.
  fields:
    request_id:
      required: true
      selector:
        text:
    context:
      selector:
        object:
refresh:
  name: Refresh strap data
  description: Request a read, limited to once per minute; optionally lease frequent activity reads.
  fields:
    frequent:
      default: false
      selector:
        boolean:
