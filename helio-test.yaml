# Include this package in the existing helio-bridge.yaml.
# Device Builder saved the Helio secrets with a per-device prefix.
external_components:
  - source:
      type: local
      path: components
    components: [helio_bridge]

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 160ms

ble_client:
  - mac_address: !secret helio_bridge__helio_mac
    id: helio_ble
    auto_connect: true
    on_connect:
      then:
        # Read once on each existing connection; do not keep the strap connected.
        - lambda: esp_ble_gap_read_rssi(id(helio_ble).get_remote_bda());

sensor:
  - platform: wifi_signal
    id: helio_wifi_rssi
    name: Helio Wi-Fi Signal
    entity_category: diagnostic
    update_interval: 15s
  - platform: ble_client
    type: rssi
    ble_client_id: helio_ble
    id: helio_ble_rssi
    name: Helio Bluetooth Signal
    entity_category: diagnostic
    update_interval: never
    on_value:
      then:
        - lambda: |-
            if (std::isfinite(x)) {
              id(helio_ble_signal) = x;
              id(helio_ble_signal_seen) = millis();
              id(helio_ble_signal_known) = true;
            }

helio_bridge:
  id: helio
  ble_client_id: helio_ble
  auth_key: !secret helio_bridge__helio_auth_key
  status:
    name: Helio Connection Test
  battery:
    id: helio_strap_battery
    name: Helio Battery
    on_value:
      then:
        - lambda: id(helio_battery_seen) = millis();
  alarm_status:
    name: Helio Alarm Status
  time_id: helio_clock
  diagnostic_status:
    name: Helio Onboard Log Status
  sleep_status:
    name: Helio Sleep Data Status
  sleep_stage:
    name: Helio Last Recorded Sleep Stage
  sleep_through:
    name: Helio Sleep Data Through
  sleep_onset:
    name: Helio Recorded Sleep Start
  sleep_sync:
    name: Helio Last Sleep Read
  sleep_changed:
    name: Helio Sleep Record Last Changed
  sleep_age:
    name: Helio Sleep Data Age
  sleep_duration:
    name: Helio Recorded Sleep Duration
  sleep_records:
    name: Helio Sleep Records Read
  learning_status:
    name: Helio Model Learning Status
  model_stage:
    name: Helio Model Sleep Stage
  smart_status:
    name: Helio Smart Wake Status
  smart_alarm:
    name: Helio Smart Wake Saved Alarm
  smart_target:
    name: Helio Smart Wake Target
  smart_awake:
    name: Helio Awake Time Added
  sleep_awake:
    name: Helio Recorded Awake Time

time:
  - platform: sntp
    id: helio_clock
    timezone: Europe/Lisbon
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            id(helio).diagnostic_event("NTP clock synchronized");
            id(helio_clock_sync).publish_state(id(helio_clock).utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"));
        - logger.log: "Helio clock synchronized directly via NTP"

text_sensor:
  - platform: template
    name: Helio Strap Link
    id: helio_strap_link
    entity_category: diagnostic
    update_interval: 5s
    lambda: return std::string(id(helio).connection_label(millis()));
  - platform: template
    id: helio_clock_sync
    name: Helio Last Clock Sync
    device_class: timestamp
    entity_category: diagnostic
    update_interval: never

datetime:
  - platform: template
    type: time
    id: helio_alarm_time
    name: Helio Alarm Time
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"

number:
  - platform: template
    id: helio_sleep_target
    name: Helio Sleep Target
    unit_of_measurement: h
    min_value: 6
    max_value: 10
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 8.5
    mode: box
  - platform: template
    id: helio_early_window
    name: Helio Light Sleep Window
    unit_of_measurement: min
    min_value: 0
    max_value: 60
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 15
    mode: box

interval:
  - interval: 10s
    then:
      - lambda: |-
          id(helio).tick_smart(id(helio_sleep_target).state, int(id(helio_early_window).state));

select:
  - platform: template
    id: helio_alarm_repeat
    name: Helio Alarm Repeat
    optimistic: true
    restore_value: true
    initial_option: Once
    options:
      - Once
      - Every day
      - Weekdays
      - Weekends

api:
  # Keep the alarm controller running when Home Assistant is offline.
  reboot_timeout: 0s
  actions:
    - action: helio_download_diagnostics
      variables:
        sequence: int
      then:
        - lambda: id(helio).download_diagnostics(sequence);
    - action: helio_set_alarm
      variables:
        hour: int
        minute: int
        repeat_mask: int
      then:
        - lambda: id(helio).set_alarm(hour, minute, repeat_mask);
    - action: helio_cancel_alarm
      then:
        - lambda: id(helio).cancel_alarm();
    - action: helio_read_sleep
      then:
        - lambda: id(helio).read_sleep();

button:
  - platform: template
    name: Test Helio Connection
    on_press:
      - lambda: id(helio).test_connection();
  - platform: template
    name: Set Helio Alarm
    on_press:
      - lambda: |-
          const auto repeat = id(helio_alarm_repeat).current_option();
          const int mask = repeat == "Every day" ? 127 : repeat == "Weekdays" ? 31 : repeat == "Weekends" ? 96 : 0;
          id(helio).set_alarm(id(helio_alarm_time).hour, id(helio_alarm_time).minute, mask);
  - platform: template
    name: Cancel Helio Alarm
    on_press:
      - lambda: id(helio).cancel_alarm();
  - platform: template
    name: Read Helio Sleep Data
    on_press:
      - lambda: id(helio).read_sleep();

switch:
  - platform: template
    name: Helio Model Learning
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(helio).set_learning_enabled(true);
    turn_off_action:
      - lambda: id(helio).set_learning_enabled(false);
  - platform: template
    name: Helio Automatic Model Updates
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(helio).set_learning_automatic(true);
    turn_off_action:
      - lambda: id(helio).set_learning_automatic(false);
  - platform: template
    id: helio_smart_wake
    name: Helio Smart Wake
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(helio).set_smart_enabled(true);
    turn_off_action:
      - lambda: id(helio).set_smart_enabled(false);
  - platform: template
    name: Helio Sleep Monitoring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(helio).set_sleep_monitoring(true);
    turn_off_action:
      - lambda: id(helio).set_sleep_monitoring(false);

# Waveshare's onboard LCD in upright 135x240 portrait orientation.
psram:
  mode: quad
  speed: 40MHz

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

output:
  - platform: ledc
    id: helio_backlight_pwm
    pin: GPIO7
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: helio_screen_light
    name: Helio Screen Brightness
    output: helio_backlight_pwm
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - light.turn_on:
          id: helio_screen_light
          brightness: 10%

globals:
  - id: helio_battery_seen
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: helio_ble_signal
    type: float
    restore_value: false
    initial_value: '0'
  - id: helio_ble_signal_seen
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: helio_ble_signal_known
    type: bool
    restore_value: false
    initial_value: 'false'

font:
  - file: "gfonts://Roboto"
    id: helio_screen_label
    size: 16
  - file: "gfonts://Roboto"
    id: helio_screen_value
    size: 48
    glyphs: "0123456789% -"
  - file: "gfonts://Roboto"
    id: helio_screen_detail
    size: 11

display:
  - platform: mipi_spi
    model: WAVESHARE-ESP32-S3-GEEK
    id: helio_screen
    rotation: 180
    color_depth: 16
    update_interval: 5s
    lambda: |-
      const Color white(230, 235, 240), grey(140, 150, 162);
      const bool known = id(helio_strap_battery).has_state() && std::isfinite(id(helio_strap_battery).state);
      const float battery = known ? id(helio_strap_battery).state : 0;
      const uint32_t age = known ? (millis() - id(helio_battery_seen)) / 60000 : 0;
      const Color accent = !known || age >= 15 ? grey : battery <= 10 ? Color(245, 85, 75) :
          battery <= 20 ? Color(240, 180, 70) : Color(100, 210, 170);
      it.print(67, 7, id(helio_screen_label), grey, TextAlign::TOP_CENTER, "HELIO STRAP");
      if (known) it.printf(67, 30, id(helio_screen_value), accent, TextAlign::TOP_CENTER, "%.0f%%", battery);
      else it.print(67, 30, id(helio_screen_value), grey, TextAlign::TOP_CENTER, "--%");
      if (!known) it.print(67, 86, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "Waiting for battery");
      else if (age == 0) it.print(67, 86, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "Battery read just now");
      else it.printf(67, 86, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "Battery read %um ago", unsigned(age));
      it.line(8, 108, 126, 108, Color(35, 42, 52));
      it.print(67, 115, id(helio_screen_label), grey, TextAlign::TOP_CENTER, "STRAP LINK");
      const auto link = id(helio).connection_indicator(millis());
      const Color link_color = link == 2 ? Color(100, 210, 170) : link == 1 ? Color(100, 165, 235) :
          link == 3 ? Color(240, 180, 70) : link == 4 ? Color(245, 85, 75) : grey;
      it.print(67, 136, id(helio_screen_detail), link_color, TextAlign::TOP_CENTER, id(helio).connection_label(millis()));
      const auto bars = [&](int bottom, int count, const Color &color) {
        for (int i = 0; i < 4; i++) {
          const int height = 4 + i * 4;
          it.filled_rectangle(12 + i * 7, bottom - height, 4, height,
                              i < count ? color : Color(35, 42, 52));
        }
      };
      if (id(helio_ble_signal_known)) {
        const float rssi = id(helio_ble_signal);
        const uint32_t signal_age = (millis() - id(helio_ble_signal_seen)) / 60000;
        const Color signal_color = signal_age >= 15 ? grey : rssi >= -60 ? Color(100, 210, 170) :
            rssi >= -75 ? Color(240, 180, 70) : Color(245, 85, 75);
        bars(169, rssi >= -60 ? 4 : rssi >= -75 ? 3 : rssi >= -85 ? 2 : 1, signal_color);
        it.printf(47, 150, id(helio_screen_label), signal_color, "%.0f dBm", rssi);
        if (signal_age == 0) it.print(67, 175, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "Last signal just now");
        else it.printf(67, 175, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "Last signal %um ago", unsigned(signal_age));
      } else {
        bars(169, 0, grey);
        it.print(47, 150, id(helio_screen_label), grey, "-- dBm");
        it.print(67, 175, id(helio_screen_detail), grey, TextAlign::TOP_CENTER, "No signal reading yet");
      }
      it.line(8, 194, 126, 194, Color(35, 42, 52));
      it.print(67, 201, id(helio_screen_label), grey, TextAlign::TOP_CENTER, "WI-FI");
      const bool wifi_connected = wifi::global_wifi_component->is_connected();
      if (wifi_connected && id(helio_wifi_rssi).has_state() && std::isfinite(id(helio_wifi_rssi).state)) {
        const float rssi = id(helio_wifi_rssi).state;
        const Color wifi_color = rssi >= -67 ? Color(100, 210, 170) :
            rssi >= -75 ? Color(240, 180, 70) : Color(245, 85, 75);
        bars(236, rssi >= -55 ? 4 : rssi >= -67 ? 3 : rssi >= -75 ? 2 : 1, wifi_color);
        it.printf(47, 219, id(helio_screen_label), wifi_color, "%.0f dBm", rssi);
      } else {
        bars(236, 0, grey);
        it.print(47, 219, id(helio_screen_detail), grey, wifi_connected ? "Reading..." : "Offline");
      }
