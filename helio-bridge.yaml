# Copy secrets.example.yaml to secrets.yaml and replace every placeholder.
esphome:
  name: helio-bridge
  friendly_name: Helio Bridge

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Helio Bridge Fallback
    password: !secret fallback_password

captive_portal:

packages:
  helio_connection_test: !include helio-test.yaml
